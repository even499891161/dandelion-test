<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="description" content="蒲公英测评中心：十六型人格、职业兴趣、抑郁焦虑筛查、大五人格、自尊与生活满意度等专业自测量表，即时反馈，数据仅保存在本地。">
<title>蒲公英 · 测评中心</title>
<link rel="stylesheet" href="https://miaoda.feishu.cn/fonts/css2?family=Noto+Serif+SC:wght@600;700;900&family=Noto+Sans+SC:wght@400;500;700&display=swap">
<style>
/* ===== 设计令牌 ===== */
:root{
  --paper:#0F1D36;
  --paper-2:#16264A;
  --card:#1B2C54;
  --ink:#F4F7FF;
  --ink-2:#B9C6E8;
  --ink-3:#7E8FBB;
  --line:#2B3F6E;
  --brand:#3CC7B2;
  --brand-deep:#2FB0A0;
  --brand-soft:rgba(60,199,178,.14);
  --accent:#6A9BFF;
  --accent-soft:rgba(106,155,255,.15);
  --good:#4ADE80;
  --warn:#F5B94A;
  --alert:#F87171;
  --radius:18px;
  --radius-s:12px;
  --shadow:0 12px 32px rgba(2,8,20,.45);
  --shadow-sm:0 4px 14px rgba(2,8,20,.35);
  --font-display:"Noto Serif SC","Source Han Serif SC","Songti SC",SimSun,serif;
  --font-body:"Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,-apple-system,sans-serif;
  --topbar-bg:rgba(15,29,54,.85);
  --on-brand:#04231E;
  --on-accent:#FFFFFF;
  --alert-soft:rgba(248,113,113,.14);
  --warn-line:rgba(245,185,74,.45);
}
html[data-theme="dark"]{
  --paper:#0A1226;
  --paper-2:#101C36;
  --card:#131F3E;
  --ink:#F4F7FF;
  --ink-2:#A9B6DA;
  --ink-3:#6E7FA8;
  --line:#22335C;
  --brand:#4CD6C0;
  --brand-deep:#3CC7B2;
  --brand-soft:rgba(76,214,192,.15);
  --accent:#7FA9FF;
  --accent-soft:rgba(127,169,255,.16);
  --good:#52E088;
  --warn:#F8C25C;
  --alert:#FA7A6A;
  --topbar-bg:rgba(10,18,38,.9);
  --on-brand:#03211C;
  --on-accent:#FFFFFF;
  --alert-soft:rgba(250,122,106,.15);
  --warn-line:rgba(248,194,92,.4);
  --shadow:0 12px 32px rgba(0,0,0,.5);
  --shadow-sm:0 4px 14px rgba(0,0,0,.35);
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{
  font-family:var(--font-body);
  color:var(--ink);
  background:var(--paper);
  line-height:1.6;
  -webkit-font-smoothing:antialiased;
  -webkit-tap-highlight-color:transparent;
}
img,svg{display:block;max-width:100%}
a{color:inherit;text-decoration:none}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:4px}

/* ===== 顶栏 ===== */
.topbar{
  position:sticky;top:0;z-index:50;
  background:var(--topbar-bg);
  -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);
  border-bottom:1px solid var(--line);
}
.topbar-in{
  max-width:1080px;margin:0 auto;padding:14px 20px;
  display:flex;align-items:center;justify-content:space-between;gap:16px;
}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--font-display);font-weight:700;font-size:20px;letter-spacing:.5px}
.brand-mark{
  width:36px;height:36px;border-radius:10px;
  background:var(--brand);color:var(--on-brand);
  display:flex;align-items:center;justify-content:center;
  box-shadow:var(--shadow-sm);
}
.brand-mark svg{width:20px;height:20px}
.topnav{display:flex;align-items:center;gap:10px}
.topnav a{
  font-size:14.5px;font-weight:700;letter-spacing:.3px;
  padding:9px 18px;border-radius:999px;
  display:inline-flex;align-items:center;gap:7px;
  transition:background .2s,color .2s,border-color .2s,transform .2s,box-shadow .2s;
}
.topnav .nav-test{border:1.5px solid var(--line);color:var(--ink)}
.topnav .nav-test:hover{background:var(--brand-soft);color:var(--brand-deep);border-color:var(--brand)}
.topnav .nav-cloud{background:var(--brand);color:var(--on-brand);box-shadow:var(--shadow-sm)}
.topnav .nav-cloud:hover{background:var(--brand-deep);transform:translateY(-1px)}
.topnav .nav-cloud svg{width:16px;height:16px}
.lang-sel{
  flex:none;height:42px;padding:0 10px;border-radius:12px;
  border:1.5px solid var(--line);background:var(--card);color:var(--ink);
  font-size:13.5px;font-weight:600;cursor:pointer;
  transition:border-color .2s,color .2s;max-width:104px;
}
.lang-sel:hover{border-color:var(--brand);color:var(--brand-deep)}
.lang-sel:focus{outline:none;border-color:var(--brand)}
.theme-btn{
  width:42px;height:42px;border-radius:12px;border:1.5px solid var(--line);
  display:flex;align-items:center;justify-content:center;color:var(--ink-2);
  transition:background .2s,color .2s,border-color .2s;flex:none;
}
.theme-btn:hover{background:var(--brand-soft);color:var(--brand-deep);border-color:var(--brand)}
.theme-btn svg{width:19px;height:19px}
.theme-btn .sun{display:none}
html[data-theme="dark"] .theme-btn .sun{display:block}
html[data-theme="dark"] .theme-btn .moon{display:none}

/* ===== 通用按钮 ===== */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  min-height:48px;padding:12px 26px;border-radius:999px;
  font-size:15px;font-weight:700;letter-spacing:.5px;
  transition:transform .15s,box-shadow .2s,background .2s;
  user-select:none;
}
.btn:active{transform:scale(.97)}
.btn-primary{background:var(--brand);color:var(--on-brand);box-shadow:0 8px 20px rgba(60,199,178,.28)}
.btn-primary:hover{background:var(--brand-deep)}
.btn-accent{background:var(--accent);color:var(--on-accent);box-shadow:0 8px 20px rgba(106,155,255,.3)}
.btn-accent:hover{background:#5A8BEE}
.btn-ghost{background:transparent;color:var(--ink-2);border:1.5px solid var(--line)}
.btn-ghost:hover{background:var(--paper-2);color:var(--ink)}
.btn-block{width:100%}

/* ===== 视图容器 ===== */
.view{max-width:1080px;margin:0 auto;padding:28px 20px 72px}
.view-narrow{max-width:700px}

/* ===== 首页 · Hero ===== */
.hero{
  padding:44px 0 20px;
}
.hero>div{max-width:680px}
.hero h1{
  font-family:var(--font-display);font-weight:900;
  font-size:clamp(30px,5vw,46px);line-height:1.28;letter-spacing:1px;
  margin-bottom:18px;
}
.hero h1 em{font-style:normal;color:var(--brand);position:relative}
.hero h1 em::after{
  content:"";position:absolute;left:0;right:0;bottom:2px;height:10px;
  background:var(--accent-soft);z-index:-1;border-radius:4px;
}
.hero p.lead{color:var(--ink-2);font-size:16px;max-width:34em;margin-bottom:28px}
.hero-cta{display:flex;gap:18px;flex-wrap:wrap;align-items:stretch;max-width:560px}
.hero-cta .btn{flex:1 1 250px;min-height:58px;font-size:16px}
.hero-meta{font-size:13px;color:var(--ink-3);margin-top:18px}
.hero-visual{
  background:linear-gradient(160deg,var(--card),var(--paper-2));
  border:1px solid var(--line);border-radius:26px;padding:26px;
  box-shadow:var(--shadow);display:flex;flex-direction:column;gap:18px;align-items:center;
}
.gauge-caption{
  width:100%;display:flex;flex-direction:column;gap:10px;
  font-size:13px;color:var(--ink-2);
}
.gauge-row{display:flex;align-items:center;justify-content:space-between;gap:12px}
.gauge-row .lab{min-width:52px;font-weight:700;color:var(--ink)}
.gauge-track{flex:1;height:8px;border-radius:99px;background:var(--paper-2);overflow:hidden}
.gauge-fill{height:100%;border-radius:99px;background:var(--brand)}
.gauge-fill.warn{background:var(--accent)}

/* ===== 首页 · 测评卡片 ===== */
.section-head{display:flex;align-items:baseline;justify-content:space-between;gap:16px;margin:44px 0 22px}
.section-head h2{font-family:var(--font-display);font-weight:700;font-size:26px;letter-spacing:.5px}
.section-head p{font-size:14px;color:var(--ink-3)}
.test-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:20px}
.test-card{
  background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
  padding:26px 24px;display:flex;flex-direction:column;gap:14px;
  box-shadow:var(--shadow-sm);transition:transform .22s,box-shadow .22s;
  position:relative;overflow:hidden;
}
.test-card::before{
  content:"";position:absolute;top:0;left:0;right:0;height:5px;
  background:var(--tint,var(--brand));opacity:.85;
}
.test-card:hover{transform:translateY(-4px);box-shadow:var(--shadow)}
.test-ic{
  width:52px;height:52px;border-radius:14px;
  background:var(--tint-soft,var(--brand-soft));color:var(--tint,var(--brand));
  display:flex;align-items:center;justify-content:center;
}
.test-ic svg{width:28px;height:28px}
.test-card h3{font-size:18px;font-weight:700;letter-spacing:.3px}
.test-card .test-meta{font-size:12.5px;color:var(--ink-3);display:flex;gap:12px;flex-wrap:wrap}
.test-card p{font-size:14px;color:var(--ink-2);flex:1}
.test-card .btn{align-self:flex-start;margin-top:4px}
.cat-sec{margin-bottom:36px}
.cat-head{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.hot-sec{
  border:1.5px solid var(--accent);border-radius:22px;
  padding:18px 20px 20px;margin-bottom:36px;
  background:linear-gradient(180deg,rgba(106,155,255,.09),transparent);
}
.cat-head h3{font-family:var(--font-display);font-weight:700;font-size:20px;letter-spacing:.5px}
.cat-head h3::before{content:"";display:inline-block;width:9px;height:9px;border-radius:99px;background:var(--cat-color,var(--brand));margin-right:10px;vertical-align:2px}
.cat-head p{font-size:13.5px;color:var(--ink-3)}
.cat-note{font-size:12.5px;color:var(--warn);background:var(--accent-soft);border:1px solid var(--warn-line);border-radius:8px;padding:8px 12px;margin-bottom:16px;line-height:1.7}
.test-chip{font-size:11.5px;font-weight:700;letter-spacing:.5px;color:var(--cat-color,var(--brand));border:1px solid var(--cat-color,var(--brand));padding:1px 9px;border-radius:999px;line-height:1.6;white-space:nowrap}

/* ===== 首页 · 特性 ===== */
.feature-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;margin-top:8px}
.feature{
  background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
  padding:22px;display:flex;gap:16px;align-items:flex-start;
}
.feature svg{width:26px;height:26px;color:var(--brand);flex:none;margin-top:2px}
.feature h4{font-size:15.5px;font-weight:700;margin-bottom:6px}
.feature p{font-size:13.5px;color:var(--ink-2)}

/* ===== 首页 · 最近记录 ===== */
.history-list{display:flex;flex-direction:column;gap:12px}
.history-item{
  background:var(--card);border:1px solid var(--line);border-radius:var(--radius-s);
  padding:16px 20px;display:flex;align-items:center;justify-content:space-between;gap:16px;
  transition:box-shadow .2s,border-color .2s;
}
.history-item:hover{border-color:var(--brand);box-shadow:var(--shadow-sm)}
.history-item .h-name{font-weight:700;font-size:15px}
.history-item .h-sub{font-size:13px;color:var(--ink-3);margin-top:2px}
.history-item .h-go{color:var(--brand);font-weight:700;font-size:14px;white-space:nowrap}

/* ===== 答题页 ===== */
.quiz-head{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:22px}
.quiz-title{display:flex;align-items:center;gap:12px;font-family:var(--font-display);font-weight:700;font-size:19px}
.quiz-title .back{
  width:42px;height:42px;border-radius:12px;border:1.5px solid var(--line);
  display:flex;align-items:center;justify-content:center;color:var(--ink-2);
  transition:background .2s,color .2s;
}
.quiz-title .back:hover{background:var(--brand-soft);color:var(--brand-deep);border-color:var(--brand)}
.quiz-title .back svg{width:20px;height:20px}
.quiz-count{font-size:13px;color:var(--ink-3);font-family:var(--font-body);font-weight:500}
.quiz-progress{height:8px;border-radius:99px;background:var(--paper-2);overflow:hidden;margin-bottom:26px}
.quiz-progress i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--brand),#2FB0A0);border-radius:99px;transition:width .4s cubic-bezier(.4,0,.2,1)}
.qcard{
  background:var(--card);border:1px solid var(--line);border-radius:22px;
  padding:clamp(24px,5vw,44px);box-shadow:var(--shadow);
  animation:qIn .32s ease both;
}
@keyframes qIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.q-num{
  display:inline-block;font-size:12.5px;font-weight:700;letter-spacing:1.5px;color:var(--brand);
  background:var(--brand-soft);padding:5px 12px;border-radius:999px;margin-bottom:16px;
}
.qcard h2{font-family:var(--font-display);font-weight:700;font-size:clamp(19px,3.2vw,24px);line-height:1.5;margin-bottom:26px;letter-spacing:.3px}
.q-opts{display:flex;flex-direction:column;gap:14px}
.opt{
  display:flex;align-items:center;gap:14px;width:100%;text-align:left;
  min-height:56px;padding:15px 18px;border-radius:14px;
  border:1.5px solid var(--line);background:var(--card);
  font-size:15px;color:var(--ink);transition:border-color .18s,background .18s,transform .12s;
}
.opt:hover{border-color:var(--brand)}
.opt:active{transform:scale(.985)}
.opt .opt-key{
  flex:none;width:30px;height:30px;border-radius:9px;
  background:var(--paper-2);color:var(--ink-2);
  display:flex;align-items:center;justify-content:center;
  font-size:13px;font-weight:700;transition:background .18s,color .18s;
}
.opt.sel{border-color:var(--brand);background:var(--brand-soft)}
.opt.sel .opt-key{background:var(--brand);color:#fff}
.opt .opt-tip{margin-left:auto;font-size:12px;color:var(--ink-3);flex:none}
.quiz-foot{display:flex;justify-content:space-between;gap:14px;margin-top:26px}
.quiz-foot .spacer{flex:1}

/* ===== 结果页 ===== */
.result-hero{text-align:center;padding:26px 0 10px}
.result-badge{
  display:inline-flex;align-items:center;gap:8px;
  font-size:13px;font-weight:700;letter-spacing:2px;color:var(--brand);
  background:var(--brand-soft);padding:7px 16px;border-radius:999px;margin-bottom:20px;
}
.result-badge svg{width:16px;height:16px}
.result-hero h1{font-family:var(--font-display);font-weight:900;font-size:clamp(28px,4.6vw,42px);letter-spacing:1px;line-height:1.3;margin-bottom:10px}
.result-hero .result-type{
  font-size:15px;color:var(--ink-2);max-width:38em;margin:0 auto 22px;
}
.result-tag{
  display:inline-block;background:var(--card);border:1.5px solid var(--line);
  border-radius:999px;padding:9px 22px;font-family:var(--font-display);font-weight:700;
  font-size:16px;letter-spacing:3px;color:var(--brand-deep);margin-bottom:8px;
}
.result-card{
  background:var(--card);border:1px solid var(--line);border-radius:22px;
  padding:clamp(24px,5vw,38px);box-shadow:var(--shadow-sm);margin-top:26px;
}
.result-card h3{
  font-family:var(--font-display);font-weight:700;font-size:19px;margin-bottom:6px;letter-spacing:.5px;
}
.result-card .sub{font-size:13.5px;color:var(--ink-3);margin-bottom:22px}
.result-card p.body{font-size:15px;color:var(--ink);line-height:1.85}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:20px}

/* 仪表盘 */
.dial-wrap{display:flex;flex-direction:column;align-items:center;gap:8px;padding:8px 0 4px}
.dial-score{font-family:var(--font-display);font-weight:900;font-size:52px;color:var(--ink);line-height:1}
.dial-score small{font-size:20px;color:var(--ink-3);font-family:var(--font-body)}
.dial-level{font-size:14.5px;font-weight:700;color:var(--brand);letter-spacing:1px}
.dial-hint{font-size:13px;color:var(--ink-3)}

/* 维度条 */
.bars{display:flex;flex-direction:column;gap:18px}
.bar-item{}
.bar-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:7px}
.bar-head .b-lab{font-size:14px;font-weight:700}
.bar-head .b-val{font-size:13px;color:var(--ink-3)}
.bar-pair{display:flex;gap:14px}
.bar-half{flex:1}
.bar-half .b-row{display:flex;justify-content:space-between;font-size:12px;color:var(--ink-2);margin-bottom:4px}
.bar-half .b-row b{color:var(--ink)}
.bar-track{height:9px;border-radius:99px;background:var(--paper-2);overflow:hidden}
.bar-track i{display:block;height:100%;border-radius:99px;background:var(--brand);transition:width .6s ease}
.bar-half.alt .bar-track i{background:var(--ink-3)}
.bar-track.acc i{background:var(--accent)}
.bar-txt{font-size:13px;color:var(--ink-2);margin-top:6px;line-height:1.6}
.help-card{background:var(--paper-2)}
.selfharm-card{border:1.5px solid var(--alert);background:var(--alert-soft)}
.selfharm-card h3{color:var(--alert)}
.rec-card{text-align:center;border-style:dashed}
.rec-card .btn{margin-top:6px}
.hotline-call{display:inline-flex;align-items:center;gap:8px;margin-top:12px}
.hotline-call svg{width:16px;height:16px}
.diary-pub .btn{margin-top:6px}
.diary-pub .body b{color:var(--brand)}
.diary-check{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--ink);margin:12px 0 4px;cursor:pointer;line-height:1.5}
.diary-check input{width:16px;height:16px;accent-color:var(--brand);flex:none}
.diary-tip{margin-top:8px;font-size:12.5px}
.diary-tip b{color:var(--brand)}
.diary-go-row{display:flex;gap:10px;margin-top:10px;flex-wrap:wrap}
.diary-go-row .btn{display:inline-flex;align-items:center;gap:8px}
.result-actions .btn{display:inline-flex;align-items:center;gap:8px;justify-content:center}
.result-actions .btn svg{width:16px;height:16px}
.share-ov{
  position:fixed;inset:0;z-index:100;background:rgba(3,9,22,.62);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);
  display:flex;align-items:center;justify-content:center;padding:24px;
}
.share-card{background:var(--paper);border:1px solid var(--line);border-radius:24px;padding:22px;max-width:min(520px,100%);max-height:92vh;overflow:auto;box-shadow:var(--shadow)}
.share-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}
.share-head h3{font-size:16px;font-weight:700}
.share-close{width:34px;height:34px;border-radius:10px;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;color:var(--ink-2);background:transparent;flex:none;transition:color .2s,border-color .2s}
.share-close:hover{color:var(--alert);border-color:var(--alert)}
.share-close svg{width:16px;height:16px}
.share-card img{width:100%;border-radius:14px;display:block;border:1px solid var(--line)}
.share-actions{display:flex;gap:12px;margin-top:16px}
.share-actions .btn{flex:1;justify-content:center}
#svToast{
  position:fixed;left:50%;bottom:56px;transform:translateX(-50%) translateY(16px);
  background:#16264A;color:#EAF0FF;padding:11px 20px;border-radius:99px;font-size:14px;
  z-index:120;opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;
}
#svToast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.norm-prev{text-align:center;color:var(--ink-2);font-size:13px;margin:-6px 0 16px}
.norm-row{margin:14px 0 2px}
.norm-head{display:flex;justify-content:space-between;align-items:baseline;font-size:13.5px;margin-bottom:8px}
.norm-head span{color:var(--ink-2)}
.norm-head b{font-size:15px;color:var(--ink)}
.norm-track{position:relative;height:14px;background:var(--paper-2);border-radius:8px}
.norm-fill{position:absolute;left:0;top:0;bottom:0;background:var(--brand);border-radius:8px;opacity:.8}
.norm-mean{position:absolute;top:-5px;bottom:-5px;width:2px;background:var(--ink-3)}
.norm-scale{display:flex;justify-content:space-between;font-size:11px;color:var(--ink-3);margin-top:5px}
.trend-svg{width:100%;height:auto;display:block;margin-top:8px}

let LANG="zh";
const CAT_KEY={personality:"p",career:"c",emotion:"e",mental:"m",fun:"f"};
function t(k){
  const has=(o)=>o&&Object.prototype.hasOwnProperty.call(o,k);
  const src=has(I18N[LANG])?I18N[LANG][k]:(has(I18N_EXT[LANG])?I18N_EXT[LANG][k]:undefined);
  if(src!=null) return src;
  if(has(I18N.zh)) return I18N.zh[k];
  if(has(I18N_EXT.zh)) return I18N_EXT.zh[k];
  return k;
}
function tf(k){ const v=t(k); const args=Array.prototype.slice.call(arguments,1); return String(v).replace(/%s/g,function(){ return args.length?args.shift():""; }); }
function MT(a,f){
  const fallback=f==="t"?a.title:(f==="d"?a.desc:(f==="m"?a.meta:a[f]));
  if(!LANG||LANG==="zh") return fallback;
  const d=META_T[LANG]&&META_T[LANG][a.id];
  const v=d&&d[f];
  return v||fallback;
}
function detectLang(){
  const l=String((navigator&&navigator.language)||"zh").toLowerCase();
  if(l.indexOf("zh")===0)return "zh"; if(l.indexOf("en")===0)return "en"; if(l.indexOf("ja")===0)return "ja";
  if(l.indexOf("ru")===0)return "ru"; if(l.indexOf("vi")===0)return "vi"; if(l.indexOf("my")===0)return "my"; return "zh";
}
function applyI18n(){
  document.querySelectorAll("[data-i18n]").forEach(function(el){ el.textContent=t(el.getAttribute("data-i18n")); });
  document.documentElement.lang=LANG==="zh"?"zh-CN":LANG;
  const ls=document.getElementById("langSel");
  if(ls) ls.value=load("sv_lang")||"auto";
}
function initLang(){
  const saved=load("sv_lang");
  LANG=(saved&&saved!=="auto")?saved:detectLang();
  applyI18n();
  const ls=document.getElementById("langSel");
  if(ls) ls.addEventListener("change",function(){
    const v=ls.value; store("sv_lang",v);
    LANG=(v&&v!=="auto")?v:detectLang();
    applyI18n(); route();
  });
}
function scrollToEl(id){
  const el=document.getElementById(id);
  if(!el) return;
  const y=el.getBoundingClientRect().top + window.scrollY - 72;
  window.scrollTo({top:y,behavior:"smooth"});
}

function levelColorFor(kind,score){
  if(kind==="phq9"||kind==="gad7") return score<=4?"var(--good)":(score<=9?"var(--warn)":"var(--alert)");
  if(kind==="rses") return score<=15?"var(--warn)":(score<=25?"var(--good)":"var(--brand)");
  if(kind==="swls") return score>=26?"var(--good)":(score>=15?"var(--warn)":"var(--alert)");
  return "var(--brand)";
}
function quizNote(kind){
  if(kind==="phq9"||kind==="gad7") return "请根据过去两周的真实感受作答。本测评仅用于筛查参考，不能替代专业诊断。";
  if(kind==="asrs6") return "请根据过去 6 个月的真实情况作答。本测评仅用于筛查参考，不能替代专业诊断。";
  if(kind==="bfi10") return "请根据日常真实表现作答，不需要过度思考。";
  return "按第一直觉作答即可，没有对错之分。";
}
function computeResult(ass, answers){
  if(ass.kind==="mbti"){
    const cnt = {};
    ["EI","SN","TF","JP"].forEach(d=>cnt[d]={a:0,b:0});
    ass.questions.forEach((q,i)=>{
      const opt=q.opts[answers[i]];
      if(!opt) return;
      const dim=cnt[q.dim];
      if(opt.p===q.opts[0].p) dim.a++; else dim.b++;
    });
    const poles=[];
    const bars=[];
    ["EI","SN","TF","JP"].forEach(d=>{
      const c=cnt[d];
      const first=d[0], second=d[1];
      const pA=Math.round(c.a/3*100), pB=100-pA;
      const dom = pA>=pB ? first : second;
      poles.push(dom);
      bars.push({label:d, a:{k:first,v:pA}, b:{k:second,v:pB}});
    });
    const code=poles.join("");
    const pf=MBTI_PROFILES[code]||{name:code,tag:"独特的你",desc:"你的性格组合非常特别，值得继续深入了解。",strength:"——",career:"——"};
    return {code,type:pf.name,tag:pf.tag,desc:pf.desc,strength:pf.strength,career:pf.career,bars};
  }
  if(ass.kind==="holland"){
    const sums={R:0,I:0,A:0,S:0,E:0,C:0};

      if(s==null) return;
      sums[q.type]+= s; // 0/1/2
    });
    const order=HOLLAND_ORDER.slice().sort((x,y)=>sums[y]-sums[x]);
    const code=order[0]+order[1];
    const top=HOLLAND_TYPES[order[0]];
    const second=HOLLAND_TYPES[order[1]];
    const bars=HOLLAND_ORDER.map(k=>({k,name:HOLLAND_TYPES[k].name,v:Math.round(sums[k]/6*100)}));
    return {code,type:top.name,tag:top.desc,second:second.name,
      desc:top.desc + " 你的主导兴趣是「"+top.name+"」，同时带有「"+second.name+"」的倾向。",
      strength:top.career,career:top.career,sums,order,bars};
  }
  if(ass.kind==="pss"){
    let score=0;
    ass.questions.forEach((q,i)=>{
      const s=answers[i];
      if(s==null) return;
      score += q.rev ? (4-s) : s;

    let level,levelColor,advice;
    if(score<=13){ level="压力水平较低"; levelColor="var(--good)"; advice="你的压力水平较低，整体状态从容稳定。请继续保持规律作息与适度运动，让这份平衡成为常态。"; }
    else if(score<=26){ level="中等压力"; levelColor="var(--warn)"; advice="你的压力处于中等水平，属于生活中常见的波动。建议留意压力来源，主动安排放松时间——运动、散步或与信任的人聊聊，都能有效调节。"; }
    else { level="压力偏高"; levelColor="var(--alert)"; advice="你近期感到压力较大，身心负荷偏重。请优先照顾自己：减少不必要的负担，保证充足睡眠，多给自己喘息的空间。若长期困扰，请及时向亲友或专业心理工作者寻求支持。"; }
    return {code:String(score),type:level,tag:advice,desc:advice,score,level,levelColor,bars:null};
  }
  if(ass.kind==="phq9"||ass.kind==="gad7"){

   渲染：仪表盘与维度条（签名元素）
================================================================ */
function polar(cx,cy,r,deg){
  const rad=(deg-90)*Math.PI/180;
  return [cx+r*Math.cos(rad), cy+r*Math.sin(rad)];
}
function arcPath(cx,cy,r,a0,a1){
  const [x0,y0]=polar(cx,cy,r,a0);
  const [x1,y1]=polar(cx,cy,r,a1);
  const large=(a1-a0)>180?1:0;
  return "M "+x0.toFixed(2)+" "+y0.toFixed(2)+" A "+r+" "+r+" 0 "+large+" 1 "+x1.toFixed(2)+" "+y1.toFixed(2);
}
function gaugeSvg(ratio, color){
  const cx=130, cy=130, r=96;
  const a0=-135, a1=135, span=270;
  const end=a0+span*Math.min(1,Math.max(0,ratio));
  const [nx,ny]=polar(cx,cy,r-30,end);
  let ticks="";
  for(let d=0; d<=4; d++){
    const a=a0+span*d/4;
    const [tx0,ty0]=polar(cx,cy,r-16,a);
    const [tx1,ty1]=polar(cx,cy,r-24,a);
    ticks += '<line x1="'+tx1.toFixed(1)+'" y1="'+ty1.toFixed(1)+'" x2="'+tx0.toFixed(1)+'" y2="'+ty0.toFixed(1)+'" stroke="var(--ink-3)" stroke-width="2" stroke-linecap="round"/>';
  }

function renderHome(){
  const hist=(load(LS_HIST)||[]).slice(0,3);
  /* 深色主题下的分区色适配：提亮 tint（图标/文字），压暗 soft（图标底） */
  function lightTint(hex){
    const n=parseInt(hex.slice(1),16), r=n>>16&255, g=n>>8&255, b=n&255;
    const f=v=>Math.round(v*0.45+140);
    return "rgb("+f(r)+","+f(g)+","+f(b)+")";
  }
  function darkSoft(hex){
    const n=parseInt(hex.slice(1),16), r=n>>16&255, g=n>>8&255, b=n&255;
    const f=v=>Math.round(v*0.16+26);
    return "rgb("+f(r)+","+f(g)+","+f(b)+")";
  }
  function cardHtml(a){
    const tint=lightTint(a.tint);
    const soft=darkSoft(a.soft||(a.id==="mbti"?"#DCEDE8":(a.id==="holland"?"#F5E7CF":"#F6E0DA")));
    const ic=testIcon(a.id);
    const cat=CATS.find(c=>c.id===a.cat);
    const catColor=cat?lightTint(cat.color):tint;
    return '<article class="test-card" style="--tint:'+tint+';--tint-soft:'+soft+';--cat-color:'+catColor+'">'+
      '<div class="test-ic">'+ic+'</div>'+
      '<h3>'+esc(MT(a,"t"))+'</h3>'+
      '<div class="test-meta"><span class="test-chip">'+esc(cat?t("cat."+(CAT_KEY[cat.id]||cat.id)):"")+'</span><span>'+esc(MT(a,"m"))+'</span></div>'+
      '<p>'+esc(MT(a,"d"))+'</p>'+
      '<button class="btn btn-primary" data-start="'+a.id+'">'+esc(t("card.start"))+'</button>'+
    '</article>';
  }
  const catSections=CATS.map(cat=>{
    const items=ASSESSMENTS.filter(a=>a.cat===cat.id && HOT.indexOf(a.id)===-1);
    if(!items.length) return "";
    return '<section class="cat-sec" style="--cat-color:'+lightTint(cat.color)+'">'+
      '<div class="cat-head"><h3>'+esc(t("cat."+(CAT_KEY[cat.id]||cat.id)))+'</h3><p>'+esc(t("cat."+(CAT_KEY[cat.id]||cat.id)+"d"))+'</p></div>'+
      (cat.id==="mental"?'<p class="cat-note">'+esc(t("cat.note"))+'</p>':"")+
      '<div class="test-grid">'+items.map(cardHtml).join("")+'</div>'+
    '</section>';
  }).join("");
  const hotList=HOT.map(id=>getAss(id)).filter(Boolean);
  const hotHtml=hotList.length?
    '<section class="cat-sec hot-sec" style="--cat-color:'+lightTint("#D97A24")+'">'+
      '<div class="cat-head"><h3>'+esc(t("home.hot"))+'</h3><p>'+esc(t("home.hotSub"))+'</p></div>'+
      '<div class="test-grid">'+hotList.map(cardHtml).join("")+'</div>'+
    '</section>' : "";

  let histHtml="";
  if(hist.length){
    histHtml = '<div class="section-head"><h2>'+esc(t("home.recent"))+'</h2><p>'+esc(t("home.recentSub"))+'</p></div>'+
      '<div class="history-list">'+
      hist.map(h=>
        '<a class="history-item" href="#result/'+h.id+'">'+
          '<div><div class="h-name">'+esc(h.title)+'</div>'+
          '<div class="h-sub">'+esc(h.resultText)+' · '+esc(h.time)+'</div></div>'+
          '<span class="h-go">'+esc(t("home.view"))+'</span>'+
        '</a>'
      ).join("")+
      '</div>';
  }

  $app.innerHTML =
  '<div class="view">'+
    '<section class="hero">'+
      '<div>'+
        '<h1>'+esc(t("hero.h1a"))+'<br>'+esc(t("hero.h1b1"))+'<em>'+esc(t("hero.h1e"))+'</em>'+esc(t("hero.h1b2"))+'</h1>'+
        '<p class="lead">'+esc(t("hero.lead"))+'</p>'+
        '<div class="hero-cta">'+
          '<button class="btn btn-primary" data-scroll="tests">'+esc(t("hero.start"))+'</button>'+
          '<a class="btn btn-ghost" href="planet.html">'+iconHeart()+esc(t("hero.cloud"))+'</a>'+
        '</div>'+
        '<p class="hero-meta">'+esc(t("hero.meta"))+'</p>'+
      '</div>'+
    '</section>'+

    '<div class="section-head" id="tests"><h2>'+esc(t("home.center"))+'</h2><p>'+esc(t("home.centerSub"))+'</p></div>'+
    hotHtml+
    catSections+

    '<div class="section-head"><h2>'+esc(t("home.why"))+'</h2></div>'+
    '<section class="feature-grid">'+
      '<div class="feature"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l7 3v5c0 4.5-3 8.2-7 10-4-1.8-7-5.5-7-10V6z"/><path d="M9 12l2 2 4-4"/></svg>'+
        '<div><h4>'+esc(t("f1t"))+'</h4><p>'+esc(t("f1d"))+'</p></div></div>'+
      '<div class="feature"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg>'+
        '<div><h4>'+esc(t("f2t"))+'</h4><p>'+esc(t("f2d"))+'</p></div></div>'+
      '<div class="feature"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h16M4 12h16M4 18h10"/></svg>'+
        '<div><h4>'+esc(t("f3t"))+'</h4><p>'+esc(t("f3d"))+'</p></div></div>'+
    '</section>'+

    '<a class="mood-promo" href="planet.html">'+
      iconHeart()+
      '<div><h4>'+esc(t("mood.t"))+'</h4><p>'+esc(t("mood.d"))+'</p></div>'+
      '<span>'+esc(t("mood.go"))+'</span>'+
    '</a>'+

    (histHtml? '<section class="hist-sec">'+histHtml+'</section>':'')+
  '</div>';

  $app.querySelectorAll("[data-start]").forEach(b=>{
    b.addEventListener("click",()=>{ location.hash="#quiz/"+b.dataset.start; });
  });
  const sc=$app.querySelector("[data-scroll]");
  if(sc) sc.addEventListener("click",()=>scrollToEl("tests"));
}

   视图：答题
================================================================ */
const quizState = {id:null, qIndex:0, answers:[]};

function startQuiz(id){
  const ass=getAss(id);
  if(!ass){ location.hash="#home"; return; }
  quizState.id=id; quizState.qIndex=0; quizState.answers=new Array(ass.questions.length).fill(undefined);
  renderQuiz();
  scrollTop();
}

function renderQuiz(){
  const ass=getAss(quizState.id);
  if(!ass){ location.hash="#home"; return; }
  const qs=ass.questions;
  const idx=Math.min(quizState.qIndex, qs.length-1);
  const q=qs[idx];
  const cur=quizState.answers[idx];
  const answered=quizState.answers.filter(a=>a!==undefined).length;
  const progress=Math.round(answered/qs.length*100);

  let opts="";
  const letters=["A","B","C","D","E","F","G"];
  if(ass.kind==="mbti"||ass.kind==="socbat"||ass.kind==="animal"){
    opts=q.opts.map((o,i)=>{
      const sel=cur===i;
      return '<button class="opt'+(sel?" sel":"")+'" data-i="'+i+'">'+
        '<span class="opt-key">'+letters[i]+'</span><span>'+esc(o.t)+'</span>'+
        (sel?'<span class="opt-tip">'+esc(t("quiz.sel"))+'</span>':'')+
      '</button>';
    }).join("");
  } else if(ass.kind==="holland"){
    const scale=[["喜欢","2"],["一般","1"],["不喜欢","0"]];
    opts=scale.map((s,i)=>{
      const sel=cur===i;
      return '<button class="opt'+(sel?" sel":"")+'" data-i="'+i+'">'+
        '<span class="opt-key">'+letters[i]+'</span><span>'+s[0]+'</span>'+
        '<span class="opt-tip">'+(s[1])+' 分</span>'+
      '</button>';
    }).join("");
  } else {
    const scale=q.opts||ass.scale||["从不","偶尔","有时","经常","总是"];
    opts=scale.map((s,i)=>{
      const sel=cur===i;
      return '<button class="opt'+(sel?" sel":"")+'" data-i="'+i+'">'+
        '<span class="opt-key">'+letters[i]+'</span><span>'+s+'</span>'+
      '</button>';
    }).join("");
  }

  const isLast=idx===qs.length-1;
  const canGo=cur!==undefined;
  const foot=
    '<div class="quiz-foot">'+
      '<button class="btn btn-ghost" id="qPrev" '+(idx===0?"disabled style=\"opacity:.4;pointer-events:none\"":"")+'>'+esc(t("quiz.prev"))+'</button>'+
      '<div class="spacer"></div>'+
      (isLast
        ? '<button class="btn btn-accent" id="qNext" '+(canGo?"":"disabled style=\"opacity:.5;pointer-events:none\"")+'>'+esc(t("quiz.done"))+'</button>'
        : '<button class="btn btn-primary" id="qNext" '+(canGo?"":"disabled style=\"opacity:.5;pointer-events:none\"")+'>'+esc(t("quiz.next"))+'</button>')
    +'</div>';

  $app.innerHTML =
  '<div class="view view-narrow">'+
    '<div class="quiz-head">'+
      '<div class="quiz-title">'+
        '<a class="back" href="#home" aria-label="返回首页">'+iconArrow()+'</a>'+
        '<span>'+esc(MT(ass,"t"))+'</span>'+
      '</div>'+
      '<div class="quiz-count">'+(idx+1)+' / '+qs.length+'</div>'+
    '</div>'+
    '<div class="quiz-progress" aria-hidden="true"><i style="width:'+progress+'%"></i></div>'+
    '<div class="qcard">'+
      '<span class="q-num">'+esc(t("quiz.qn"))+' '+(idx+1)+esc(t("quiz.qn2"))+'</span>'+
      '<h2>'+esc(q.q)+'</h2>'+
      '<div class="q-opts">'+opts+'</div>'+
      foot+
    '</div>'+
    '<p class="notice">'+quizNote(ass.kind)+'</p>'+
    '<p class="quiz-src">'+esc(ass.src)+'</p>'+
  '</div>';

  $app.querySelectorAll(".opt").forEach(b=>{
    b.addEventListener("click",()=>{
      const i=+b.dataset.i;
      if(quizState.answers[idx]!==undefined) return;
      quizState.answers[idx]=i;
      renderQuiz();
    });
  });
  const prev=document.getElementById("qPrev");
  if(prev) prev.addEventListener("click",()=>{
    if(quizState.qIndex>0){ quizState.qIndex--; renderQuiz(); scrollTop(); }
  });
  const next=document.getElementById("qNext");
  if(next) next.addEventListener("click",()=>{
    if(quizState.answers[idx]===undefined) return;
    if(isLast){
      const res=computeResult(ass,quizState.answers);
      store(LS_KEY(ass.id), quizState.answers);
      saveHistory(ass,res);
      location.hash="#result/"+ass.id;
    } else {
      quizState.qIndex++;
      renderQuiz();
      scrollTop();
    }
  });
}

function saveHistory(ass,res){
  const hist=load(LS_HIST)||[];
  const time=new Date();
  hist.unshift({
    id:ass.id,
    title:ass.title,
    resultText: (function(){
      if(ass.kind==="bfi10"||ass.kind==="olbi") return res.type;
      if(ass.kind==="mbti"||ass.kind==="holland") return res.type+"型 · "+res.code;
      if(ass.kind==="ecr"||ass.kind==="socbat"||ass.kind==="animal"||ass.kind==="mlq") return res.type;
      return res.type+" · "+res.score+" 分";
    })(),
    ts:time.getTime()
  });
  store(LS_HIST, hist.slice(0,10));
  if(res.score!=null&&res.max!=null){
    const trKey="sv_trend_"+ass.id;
    const trend=load(trKey)||[];
    trend.push({ts:time.getTime(),score:res.score,max:res.max,type:res.type});
    store(trKey,trend.slice(-40));
  }
}

}

function levelHex(lc){
  const m={good:"#4ADE80",warn:"#F5B94A",alert:"#F87171",brand:"#3CC7B2",accent:"#6A9BFF"};
  const k=String(lc||"").replace("var(--","").replace(")","");
  return m[k]||"#3CC7B2";
}
function roundRect(ctx,x,y,w,h,r){
  const rr=Math.min(r,w/2,h/2);
  ctx.beginPath();
  ctx.moveTo(x+rr,y);
  ctx.arcTo(x+w,y,x+w,y+h,rr);
  ctx.arcTo(x+w,y+h,x,y+h,rr);
  ctx.arcTo(x,y+h,x,y,rr);
  ctx.arcTo(x,y,x+w,y,rr);
  ctx.closePath();
}
function wrapText(ctx,text,maxW){
  const chars=Array.from(text);
  let line="",lines=[];
  for(let i=0;i<chars.length;i++){
    const t=line+chars[i];
    if(line&&ctx.measureText(t).width>maxW){ lines.push(line); line=chars[i]; }
    else line=t;
  }
  if(line) lines.push(line);
  return lines;
}
function drawDial(ctx,cx,cy,r,ratio,color,ink,ink2,FONT,score,max){
  ctx.lineWidth=26; ctx.lineCap="round";
  ctx.strokeStyle="#EAE3D4";
  ctx.beginPath(); ctx.arc(cx,cy,r,-Math.PI*0.75,Math.PI*0.75); ctx.stroke();
  ctx.strokeStyle=color;
  ctx.beginPath(); ctx.arc(cx,cy,r,-Math.PI*0.75,-Math.PI*0.75+Math.PI*1.5*Math.max(0,Math.min(1,ratio))); ctx.stroke();
  ctx.fillStyle=ink; ctx.font="900 118px "+FONT; ctx.textAlign="center"; ctx.textBaseline="middle";
  ctx.fillText(String(score),cx,cy-16);
  ctx.fillStyle=ink2; ctx.font="34px "+FONT;
  ctx.fillText("/ "+max,cx,cy+44);
  ctx.textBaseline="alphabetic";
}
function drawSplitBar(ctx,x,y,w,h,a,b,ca,cb){
  const total=a+b||1;
  const wa=w*a/total;
  ctx.fillStyle="#263A66"; roundRect(ctx,x,y,w,h,h/2); ctx.fill();
  if(wa>0){ ctx.fillStyle=ca; roundRect(ctx,x,y,Math.max(h,wa),h,h/2); ctx.fill(); }
  if(wa<w){ ctx.fillStyle=cb; roundRect(ctx,x+wa-2,y,w-wa+2,h,h/2); ctx.fill(); }
}

  const ctx=cv.getContext("2d");
  const FONT="'PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif";
  const brand="#3CC7B2", ink="#F4F7FF", ink2="#A9B6DA", paper="#0F1D36", card="#1B2C54", lineC="#2B3F6E", track="#263A66";
  const accent="#6A9BFF", alertC="#F87171";
  const barColor = res.bars ? levelHex(res.levelColor) : brand;
  ctx.fillStyle=paper; ctx.fillRect(0,0,W,H);
  ctx.fillStyle="rgba(60,199,178,.12)"; ctx.beginPath(); ctx.arc(40,90,230,0,Math.PI*2); ctx.fill();
  ctx.fillStyle="rgba(106,155,255,.10)"; ctx.beginPath(); ctx.arc(W-30,230,200,0,Math.PI*2); ctx.fill();
  ctx.fillStyle=brand; ctx.font="600 42px "+FONT; ctx.textAlign="left";
  ctx.fillText(t("brand"), 70, 100);
  const d=new Date();
  ctx.fillStyle=ink2; ctx.font="30px "+FONT; ctx.textAlign="right";
  ctx.fillText(d.getFullYear()+"."+(d.getMonth()+1)+"."+d.getDate(), W-70, 100);
  ctx.fillStyle=ink; ctx.font="700 58px "+FONT; ctx.textAlign="left";
  ctx.fillText(MT(ass,"t"), 70, 220);

  const cardX=70, cardY=280, cardW=W-140;
  let cardH, mode;
  if(ass.kind==="mbti"){mode="mb"; cardH=660;}
  else if(ass.kind==="holland"){mode="bars"; cardH=800;}
  else if(ass.kind==="bfi10"){mode="bars"; cardH=742;}
  else if(ass.kind==="ecr"||ass.kind==="olbi"||ass.kind==="mlq"){mode="bars"; cardH=432;}
  else if(ass.kind==="socbat"||ass.kind==="animal"){mode="fun"; cardH=300;}
  else {mode="dial"; cardH=472;}
  ctx.fillStyle=card; roundRect(ctx,cardX,cardY,cardW,cardH,30); ctx.fill();
  ctx.strokeStyle=lineC; ctx.lineWidth=2.5; roundRect(ctx,cardX,cardY,cardW,cardH,30); ctx.stroke();

  const typeSize=res.type.length>8?60:78;
  ctx.fillStyle=brand; ctx.font="900 "+typeSize+"px "+FONT; ctx.textAlign="center";
  ctx.fillText(res.type, W/2, cardY+118);
  ctx.fillStyle=ink2; ctx.font="32px "+FONT;
  let codeTxt="";
  if(res.score!=null&&res.max!=null) codeTxt=tf("share.scoreT",res.score,res.max);
  else if(res.code) codeTxt=res.code;
  ctx.fillText(codeTxt, W/2, cardY+172);
  ctx.strokeStyle=lineC; ctx.lineWidth=2; ctx.beginPath();
  ctx.moveTo(cardX+80, cardY+218); ctx.lineTo(cardX+cardW-80, cardY+218); ctx.stroke();

  if(mode==="dial"){
    const ratio=res.max?res.score/res.max:0;
    drawDial(ctx,W/2,cardY+cardH/2+26,175,ratio,levelHex(res.levelColor),ink,ink2,FONT,res.score,res.max);
  } else if(mode==="mb"){
    res.bars.forEach((b,i)=>{
      const y=cardY+270+i*138;
      ctx.fillStyle=ink; ctx.font="600 30px "+FONT; ctx.textAlign="left";
      ctx.fillText(b.label+"（"+b.a.k+" / "+b.b.k+"）", cardX+90, y+26);
      ctx.fillStyle=ink2; ctx.font="28px "+FONT; ctx.textAlign="right";
      ctx.fillText(b.a.v+" / "+b.b.v, cardX+cardW-90, y+26);
      drawSplitBar(ctx,cardX+90,y+52,cardW-180,22,b.a.v,b.b.v,brand,accent);
    });
  } else if(mode==="bars"){
    const rowH=cardH>=740?112:150;
    res.bars.forEach((b,i)=>{
      const y=cardY+268+i*rowH;
      const label=b.name?(b.name+(b.k?"（"+b.k+"）":"")+(b.band?" · "+b.band:"")):b.k;
      const sub=(b.band&&b.pct!=null)?(b.band+" · "+b.pct+"%"):(b.pct!=null?b.pct+"%":(b.v!=null?b.v+"%":""));
      const vv=Math.max(0,Math.min(100,(b.pct!=null?b.pct:b.v)||0));
      ctx.fillStyle=ink; ctx.font="600 30px "+FONT; ctx.textAlign="left";
      ctx.fillText(label, cardX+90, y+30);
      ctx.fillStyle=ink2; ctx.font="28px "+FONT; ctx.textAlign="right";
      ctx.fillText(sub, cardX+cardW-90, y+30);
      ctx.fillStyle=track; roundRect(ctx,cardX+90,y+56,cardW-180,22,11); ctx.fill();
      ctx.fillStyle=barColor; roundRect(ctx,cardX+90,y+56,(cardW-180)*vv/100,22,11); ctx.fill();
    });
  } else {
    ctx.fillStyle=ink2; ctx.font="30px "+FONT; ctx.textAlign="center";
    ctx.fillText(t("share.fun"), W/2, cardY+cardH-70);
  }

  ctx.font="30px "+FONT;
  const qy=cardY+cardH+74;
  const qLines=wrapText(ctx,res.desc,cardW);
  qLines.slice(0,3).forEach((ln,i)=>{
    ctx.fillStyle=ink2; ctx.textAlign="left";
    ctx.fillText(ln, cardX, qy+i*48);
  });
  if(qLines.length>3){ ctx.fillStyle=ink2; ctx.fillText("……", cardX, qy+3*48); }

  const f2=H-96, f1=H-152;
  if(ass.cat==="mental"){
    ctx.fillStyle=alertC; ctx.font="600 30px "+FONT; ctx.textAlign="center";
    ctx.fillText(t("share.hotline"), W/2, f1);
  }
  ctx.fillStyle=ink2; ctx.font="28px "+FONT; ctx.textAlign="center";
  ctx.fillText(t("share.disc"), W/2, ass.cat==="mental"?f1+54:f1);
  ctx.fillStyle=brand; ctx.font="600 34px "+FONT; ctx.textAlign="center";
  ctx.fillText(t("share.foot"), W/2, f2);

  showShareModal(cv.toDataURL("image/png"), ass.title);
}
function showShareModal(dataUrl,title){
  const ov=document.createElement("div");
  ov.className="share-ov";
  ov.innerHTML=
    '<div class="share-card">'+
      '<div class="share-head"><h3>'+esc(t("share.head"))+'</h3>'+
      '<button class="share-close" aria-label="关闭">'+iconClose()+'</button></div>'+
      '<img src="'+dataUrl+'" alt="测评结果分享图">'+
      '<div class="share-actions">'+
        '<a class="btn btn-primary" download="'+encodeURIComponent(t("brand")+"-"+title+"-"+t("share.dl"))+'.png" href="'+dataUrl+'">'+esc(t("share.save"))+'</a>'+
        '<button class="btn btn-ghost share-close2">'+esc(t("share.close"))+'</button>'+
      '</div>'+
    '</div>';
  document.body.appendChild(ov);
  const close=function(){ if(ov.parentNode) ov.parentNode.removeChild(ov); };
  ov.querySelector(".share-close").addEventListener("click",close);
  ov.querySelector(".share-close2").addEventListener("click",close);
  ov.addEventListener("click",function(e){ if(e.target===ov) close(); });
}
let toastTimer=null;
function toast(msg){
  let el=document.getElementById("svToast");
  if(!el){ el=document.createElement("div"); el.id="svToast"; document.body.appendChild(el); }
  el.textContent=msg;
  el.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer=setTimeout(function(){ el.classList.remove("show"); },2200);
}
function copyResultText(ass,res){
  let core="";
  if(res.score!=null&&res.max!=null) core=res.type+tf("copy.score",res.score,res.max);
  else if(res.code) core=res.type+"（"+res.code+"）";
  else core=res.type;
  const txt=tf("copy.tpl",MT(ass,"t"),core,res.desc);
  copyText(ass.cat==="mental"?txt+t("copy.mental"):txt);
}
function legacyCopy(t,done){
  const ta=document.createElement("textarea");
  ta.value=t; ta.style.position="fixed"; ta.style.opacity="0";
  document.body.appendChild(ta); ta.select();
  try{ document.execCommand("copy"); done(); }catch(e){ toast(t("toast.copyFail")); }
  document.body.removeChild(ta);
}
function copyText(t){
  const done=function(){ toast(t("toast.copied")); };
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(t).then(done).catch(function(){ legacyCopy(t,done); });
  } else legacyCopy(t,done);
}

/* ================================================================
   常模对比 + 历史趋势
================================================================ */
function normCdf(z){
  const t=1/(1+0.2316419*Math.abs(z));
  const d=0.3989423*Math.exp(-z*z/2);
  const p=d*t*(0.3193815+t*(-0.3565638+t*(1.781478+t*(-1.821256+t*1.330274))));
  return z>0?1-p:p;
}
function normRowHtml(label,val,m,sd,min,max){
  const span=(max-min)||1;
  const vp=Math.max(0,Math.min(100,(val-min)/span*100));
  const mp=Math.max(0,Math.min(100,(m-min)/span*100));
  const valTxt=(Math.round(val*10)/10);
  return '<div class="norm-row">'+
    '<div class="norm-head"><span>'+label+'</span><b>'+valTxt+'</b></div>'+
    '<div class="norm-track"><span class="norm-fill" style="width:'+vp+'%"></span>'+
    '<i class="norm-mean" style="left:'+mp+'%"></i></div>'+
    '<div class="norm-scale"><span>'+min+'</span><span>'+max+'</span></div>'+
  '</div>';
}
function normCardHtml(ass,res){
  const n=ass.norm; if(!n) return "";
  let rows="",note="";
  if(ass.kind==="ecr"){
    if(!res.bars2) return "";
    rows=normRowHtml("依恋焦虑",res.bars2[0],n.an.m,n.an.sd,1,7)+
         normRowHtml("依恋回避",res.bars2[1],n.av.m,n.av.sd,1,7);
    note="常模基于 ECR 系列量表的公开研究近似估计";
  } else if(ass.kind==="olbi"){
    if(!res.bars2) return "";
    const over=(res.bars2[0]+res.bars2[1])/2;
    rows=normRowHtml("总体倦怠",over,n.m,n.sd,1,4);
    note="常模为近似参考值";
  } else if(ass.kind==="mlq"){
    if(!res.bars2) return "";
    rows=normRowHtml("意义感（拥有）",res.bars2[0],n.p.m,n.p.sd,7,35)+
         normRowHtml("意义追寻",res.bars2[1],n.s.m,n.s.sd,7,35);
    note="常模基于 MLQ 公开研究的均值与标准差近似估计";
  } else {
    const pct=Math.round(normCdf(n.hi?(res.score-n.m)/n.sd:(n.m-res.score)/n.sd)*100);
    const pctTxt=pct<=0?"不足 1%":(pct>=99?"99% 以上":pct+"%");
    const sent=n.hi
      ? "你的得分高于常模平均水平，超过了约 <b>"+pctTxt+"</b> 的常模人群。"
      : "你的得分低于常模平均水平，比约 <b>"+pctTxt+"</b> 的常模人群状态更轻。";
    rows='<p class="body" style="font-size:14px;margin-bottom:14px">'+sent+'</p>'+
         normRowHtml("本次得分",res.score,n.m,n.sd,0,res.max);
    note="常模数据来自该量表公开研究的均值与标准差";
  }
  return '<div class="result-card norm-card"><h3>'+esc(t("result.norm"))+'</h3>'+
    '<p class="sub">'+tf("result.normSub",esc(note))+'</p>'+rows+
    '<p class="notice">'+esc(t("result.normNote"))+'</p></div>';
}
function renderTrendCard(ass,res){
  const tr=load("sv_trend_"+ass.id)||[];
  if(tr.length<2) return "";
  const recent=tr.slice(-12);
  const n=recent.length;
  const scores=recent.map(function(t){ return t.score; });
  let lo=Math.min.apply(null,scores.concat([0]));
  let hi=Math.max.apply(null,scores.concat([res.max||0]));
  if(hi-lo<4){ hi=lo+4; }
  const W=560,H=220,PADL=38,PADR=16,PADT=26,PADB=38;
  const pw=W-PADL-PADR, ph=H-PADT-PADB;
  const x=function(i){ return PADL+(n===1?pw/2:i/(n-1)*pw); };
  const y=function(s){ return PADT+ph-(s-lo)/(hi-lo)*ph; };
  const pts=recent.map(function(t,i){ return x(i).toFixed(1)+","+y(t.score).toFixed(1); }).join(" ");
  let grid="";
  for(let g=0;g<=3;g++){
    const gy=PADT+ph*g/3, gv=hi-(hi-lo)*g/3;
    grid+='<line x1="'+PADL+'" y1="'+gy+'" x2="'+(W-PADR)+'" y2="'+gy+'" class="tg-grid"/>'+
      '<text x="'+(PADL-10)+'" y="'+(gy+4)+'" class="tg-y" text-anchor="end">'+Math.round(gv)+'</text>';
  }
  const labels=recent.map(function(t,i){
    const d=new Date(t.ts);
    return '<text x="'+x(i)+'" y="'+(H-PADB+20)+'" class="tg-x" text-anchor="middle">'+(d.getMonth()+1)+"/"+d.getDate()+'</text>';
  }).join("");
  const dots=recent.map(function(t,i){
    return '<circle cx="'+x(i)+'" cy="'+y(t.score)+'" r="4.5" class="tg-dot'+(i===n-1?" tg-last":"")+'"/>'+
      '<text x="'+x(i)+'" y="'+(y(t.score)-12)+'" class="tg-val" text-anchor="middle">'+t.score+'</text>';
  }).join("");
  const last=scores[n-1], prev=scores[n-2];
  let deltaHtml="";
  if(prev!=null){
    const d=last-prev;
    const hiBetter=ass.norm&&ass.norm.hi;
    const imp=hiBetter?d>0:d<0;
    const txt=d>0?"+"+d:(d<0?"-"+Math.abs(d):esc(t("trend.flat")));
    deltaHtml='<span class="tg-delta '+(imp?"good":"warn")+'">'+tf("trend.delta",txt)+'</span>';
  }
  return '<div class="result-card trend-card"><h3>'+esc(t("result.trend"))+'</h3>'+
    '<p class="sub">'+esc(t("result.trendSub"))+deltaHtml+'</p>'+
    '<svg viewBox="0 0 '+W+' '+H+'" class="trend-svg" role="img" aria-label="历次得分折线图">'+
      grid+labels+'<polyline points="'+pts+'" class="tg-line-soft"/><polyline points="'+pts+'" class="tg-line"/><g>'+dots+'</g>'+
    '</svg>'+
    '<p class="notice">'+tf("result.trendNote",tr.length)+'</p>'+
  '</div>';
}

function route(){
  const h=location.hash||"#home";
  if(h.indexOf("#quiz/")===0){
    startQuiz(h.slice(6));
  } else if(h.indexOf("#result/")===0){
    renderResult(h.slice(8));
  } else {
    renderHome();
    scrollTop();
  }
}
window.addEventListener("hashchange",route);

/* 页脚：清除本地测评记录（最近记录 / 作答 / 趋势） */
function clearLocalData(){
  const btn=document.querySelector(".foot-clear");
  if(!btn||!btn._arm){
    if(btn){ btn._arm=1; btn.textContent=t("foot.confirm");
      setTimeout(()=>{ btn._arm=0; btn.textContent=t("foot.clear"); },3000); }
    return;
  }
  let n=0;
  Object.keys(localStorage).forEach(k=>{
    if(k.indexOf("sv_")===0&&k!=="sv_theme"&&k!=="sv_lang"){ localStorage.removeItem(k); n++; }
  });
  btn._arm=0; btn.textContent=tf("foot.cleared",n);
  setTimeout(()=>{ btn.textContent=t("foot.clear"); },2500);
  location.hash="#home"; route();
}
document.addEventListener("DOMContentLoaded",function(){
  const b=document.querySelector(".foot-clear");
  if(b) b.addEventListener("click",clearLocalData);
});
initLang();
route();
